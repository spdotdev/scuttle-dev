name: Live smoke

# A watch on the live site every six hours (the weekly crawl in live-links.yml is too slow to catch a broken feed or a
# missing page). No browser: scripts/live-smoke.py reads scripts/smoke-urls.txt and checks status, a marker phrase and the
# answer time of each address, three tries 20 seconds apart. The job fails and lists every failing address.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/live-smoke.py https://scuttle.dev scripts/smoke-urls.txt
