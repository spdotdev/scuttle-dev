<!doctype html><html><head><meta charset="utf-8"><title>Scuttle logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Geist,sans-serif;background:#e9e9ee;color:#111;padding:32px}
h1{font-size:18px;font-weight:500;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.opt{border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 10px 30px -18px rgba(0,0,0,.4)}
.opt .n{font:500 12px "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;color:#666;display:flex;justify-content:space-between}
.pair{display:grid;grid-template-columns:1fr 1fr}
.cell{height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.cell.l{background:#f5f5f5;color:#0a0a0a}.cell.d{background:#0b0b0b;color:#f2f2f2}
.cell svg{width:112px;height:72px}
.wm{display:flex;align-items:center;gap:10px;font:600 15px "Geist Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.wm svg{width:34px;height:22px}
.small{display:flex;gap:12px;align-items:center;margin-top:4px}
.small svg{width:22px;height:14px}
</style></head><body>
<h1>Scuttle logo, twenty-two oval ring options, 02 and 04 kept. Each shown on light and dark, large, as wordmark, and at favicon size.</h1>
<svg width="0" height="0" style="position:absolute">
 <defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5454D4"/><stop offset="1" stop-color="#9A9AF7"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5454D4"/><stop offset="1" stop-color="#22D3C5"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5454D4" stop-opacity=".25"/><stop offset="1" stop-color="#5454D4"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5454D4" stop-opacity="0"/><stop offset=".35" stop-color="#5454D4"/><stop offset="1" stop-color="#9A9AF7"/></linearGradient>
 </defs>
</svg>
<div class="grid" id="g"></div>
<script>
// every option is drawn in a 140 x 90 box, oval ratio about 1.6 : 1
var O=[
 ["02 double orbit (kept)","two thin ovals, one tilted",
  '<ellipse cx="70" cy="45" rx="58" ry="26" fill="none" stroke="url(#g1)" stroke-width="7"/><ellipse cx="70" cy="45" rx="58" ry="26" fill="none" stroke="url(#g1)" stroke-width="7" opacity=".45" transform="rotate(-28 70 45)"/>'],
 ["04 stacked rings (kept)","three ovals stacked, fading downward",
  '<ellipse cx="70" cy="60" rx="54" ry="20" fill="none" stroke="#5454D4" stroke-width="6" opacity=".22"/><ellipse cx="70" cy="46" rx="54" ry="20" fill="none" stroke="#5454D4" stroke-width="6" opacity=".55"/><ellipse cx="70" cy="32" rx="54" ry="20" fill="none" stroke="url(#g1)" stroke-width="6"/>'],
 ["07 orbit, equal weight","two ovals crossing at a sharper angle, same weight, same gradient",
  '<ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="url(#g1)" stroke-width="7" transform="rotate(14 70 45)"/><ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="url(#g1)" stroke-width="7" transform="rotate(-34 70 45)"/>'],
 ["08 orbit with core","two crossing ovals around a solid dot",
  '<ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="url(#g1)" stroke-width="6" transform="rotate(12 70 45)"/><ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="url(#g1)" stroke-width="6" opacity=".5" transform="rotate(-30 70 45)"/><circle cx="70" cy="45" r="9" fill="#5454D4"/>'],
 ["09 orbit, one open","one closed oval, one open oval that fades out, like a path still being drawn",
  '<ellipse cx="70" cy="45" rx="58" ry="25" fill="none" stroke="#5454D4" stroke-width="7"/><ellipse cx="70" cy="45" rx="58" ry="25" fill="none" stroke="url(#g4)" stroke-width="7" stroke-linecap="round" transform="rotate(-32 70 45)" stroke-dasharray="230 100"/>'],
 ["10 triple orbit","three thin ovals at 0, 30 and 60 degrees, fading as they turn",
  '<ellipse cx="70" cy="45" rx="58" ry="22" fill="none" stroke="#5454D4" stroke-width="5"/><ellipse cx="70" cy="45" rx="58" ry="22" fill="none" stroke="#5454D4" stroke-width="5" opacity=".55" transform="rotate(-30 70 45)"/><ellipse cx="70" cy="45" rx="58" ry="22" fill="none" stroke="#5454D4" stroke-width="5" opacity=".25" transform="rotate(-60 70 45)"/>'],
 ["11 orbit, thin and thick","one thick oval and one hairline oval tilted across it",
  '<ellipse cx="70" cy="45" rx="56" ry="27" fill="none" stroke="url(#g1)" stroke-width="11"/><ellipse cx="70" cy="45" rx="60" ry="22" fill="none" stroke="#5454D4" stroke-width="2.5" transform="rotate(-24 70 45)"/>'],
 ["12 orbit, indigo and teal","two crossing ovals, one indigo, one teal, the only two-colour option",
  '<ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="#5454D4" stroke-width="7" transform="rotate(10 70 45)"/><ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="#22D3C5" stroke-width="7" opacity=".9" transform="rotate(-34 70 45)"/>'],
 ["13 stacked, two rings","two ovals stacked, the top one full, the bottom one a shadow",
  '<ellipse cx="70" cy="56" rx="56" ry="22" fill="none" stroke="#5454D4" stroke-width="7" opacity=".3"/><ellipse cx="70" cy="36" rx="56" ry="22" fill="none" stroke="url(#g1)" stroke-width="7"/>'],
 ["14 stacked, tight coil","four thin ovals close together, like a coil or a spring",
  '<ellipse cx="70" cy="62" rx="52" ry="17" fill="none" stroke="#5454D4" stroke-width="4.5" opacity=".2"/><ellipse cx="70" cy="52" rx="52" ry="17" fill="none" stroke="#5454D4" stroke-width="4.5" opacity=".4"/><ellipse cx="70" cy="42" rx="52" ry="17" fill="none" stroke="#5454D4" stroke-width="4.5" opacity=".65"/><ellipse cx="70" cy="32" rx="52" ry="17" fill="none" stroke="url(#g1)" stroke-width="4.5"/>'],
 ["15 stacked, offset","three ovals stacked and shifted sideways, like layers sliding into place",
  '<ellipse cx="58" cy="60" rx="50" ry="19" fill="none" stroke="#5454D4" stroke-width="6" opacity=".22"/><ellipse cx="66" cy="46" rx="50" ry="19" fill="none" stroke="#5454D4" stroke-width="6" opacity=".55"/><ellipse cx="74" cy="32" rx="50" ry="19" fill="none" stroke="url(#g1)" stroke-width="6"/>'],
 ["16 stacked, top solid","three stacked ovals, the top one a solid filled disc with a gradient",
  '<ellipse cx="70" cy="62" rx="52" ry="19" fill="none" stroke="#5454D4" stroke-width="6" opacity=".22"/><ellipse cx="70" cy="48" rx="52" ry="19" fill="none" stroke="#5454D4" stroke-width="6" opacity=".5"/><ellipse cx="70" cy="33" rx="52" ry="19" fill="url(#g1)"/>'],
 ["17 stacked, growing","three ovals stacked, each wider than the one above, like a base",
  '<ellipse cx="70" cy="62" rx="58" ry="20" fill="none" stroke="#5454D4" stroke-width="6" opacity=".25"/><ellipse cx="70" cy="47" rx="48" ry="17" fill="none" stroke="#5454D4" stroke-width="6" opacity=".55"/><ellipse cx="70" cy="33" rx="38" ry="14" fill="none" stroke="url(#g1)" stroke-width="6"/>'],
 ["18 stacked, one tilted","two flat stacked ovals with a third one standing across them, stack plus orbit",
  '<ellipse cx="70" cy="58" rx="54" ry="19" fill="none" stroke="#5454D4" stroke-width="6" opacity=".25"/><ellipse cx="70" cy="44" rx="54" ry="19" fill="none" stroke="#5454D4" stroke-width="6" opacity=".55"/><ellipse cx="70" cy="44" rx="54" ry="19" fill="none" stroke="url(#g1)" stroke-width="6" transform="rotate(-32 70 44)"/>'],
 ["19 nested ovals","two ovals one inside the other, outer light, inner strong",
  '<ellipse cx="70" cy="45" rx="60" ry="32" fill="none" stroke="#5454D4" stroke-width="5" opacity=".3"/><ellipse cx="70" cy="45" rx="40" ry="20" fill="none" stroke="url(#g1)" stroke-width="8"/>'],
 ["20 orbit, gap on both","two crossing ovals, each with a gap where it passes behind the other",
  '<ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="#5454D4" stroke-width="7" transform="rotate(12 70 45)" stroke-dasharray="150 28 150 28" stroke-dashoffset="-60" stroke-linecap="round"/><ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="url(#g1)" stroke-width="7" transform="rotate(-32 70 45)" stroke-dasharray="150 28 150 28" stroke-dashoffset="20" stroke-linecap="round"/>']
,
 ["21 orbit, pill","two crossing ovals with very rounded, almost pill-shaped ends, thick stroke",
  '<rect x="12" y="23" width="116" height="44" rx="22" fill="none" stroke="url(#g1)" stroke-width="8" transform="rotate(12 70 45)"/><rect x="12" y="23" width="116" height="44" rx="22" fill="none" stroke="#5454D4" stroke-width="8" opacity=".45" transform="rotate(-30 70 45)"/>'],
 ["22 orbit, dot on crossing","two thin ovals with a dot where they cross",
  '<ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="#5454D4" stroke-width="5" transform="rotate(14 70 45)"/><ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="#5454D4" stroke-width="5" opacity=".5" transform="rotate(-34 70 45)"/><circle cx="121" cy="36" r="8" fill="url(#g1)"/>'],
 ["23 stacked, left to right fade","three stacked ovals that fade from left to right instead of top to bottom",
  '<ellipse cx="70" cy="60" rx="54" ry="19" fill="none" stroke="url(#g4)" stroke-width="6"/><ellipse cx="70" cy="46" rx="54" ry="19" fill="none" stroke="url(#g4)" stroke-width="6"/><ellipse cx="70" cy="32" rx="54" ry="19" fill="none" stroke="url(#g4)" stroke-width="6"/>'],
 ["24 stacked, hidden lines","three stacked ovals where each lower ring is hidden behind the one above, solid look",
  '<ellipse cx="70" cy="60" rx="54" ry="19" fill="#f5f5f5" stroke="#5454D4" stroke-width="6" opacity=".35"/><ellipse cx="70" cy="46" rx="54" ry="19" fill="#f5f5f5" stroke="#5454D4" stroke-width="6" opacity=".7"/><ellipse cx="70" cy="32" rx="54" ry="19" fill="#f5f5f5" stroke="url(#g1)" stroke-width="6"/>'],
 ["25 single orbit, gradient sweep","one oval only, tilted, stroke sweeps from dark indigo to light, closed",
  '<ellipse cx="70" cy="45" rx="58" ry="24" fill="none" stroke="url(#g1)" stroke-width="9" transform="rotate(-22 70 45)"/>'],
 ["26 orbit and stack combined","two flat stacked rings as a base with a tilted orbit ring through them, lighter weight",
  '<ellipse cx="70" cy="56" rx="50" ry="17" fill="none" stroke="#5454D4" stroke-width="4.5" opacity=".3"/><ellipse cx="70" cy="45" rx="50" ry="17" fill="none" stroke="#5454D4" stroke-width="4.5" opacity=".6"/><ellipse cx="70" cy="45" rx="58" ry="22" fill="none" stroke="url(#g1)" stroke-width="7" transform="rotate(-38 70 45)"/>']];

var g=document.getElementById("g");
O.forEach(function(o){var svg=function(c){return '<svg viewBox="0 0 140 90" '+(c||'')+'>'+o[2]+'</svg>'};
 g.innerHTML+='<div class="opt"><div class="n"><span>'+o[0]+'</span></div><div class="pair">'+["l","d"].map(function(t){return '<div class="cell '+t+'">'+svg()+'<div class="wm">'+svg()+'Scuttle</div><div class="small">'+svg()+'<span style="font:11px Geist Mono">16 px</span></div></div>'}).join("")+'</div><div class="n" style="text-transform:none;letter-spacing:0;font-family:Geist">'+o[1]+'</div></div>'});
</script></body></html>
